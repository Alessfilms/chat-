{

  f.fillStyle = '#060b0a'; f.fillRect(0, 0, fog.width, fog.height); f.translate(-li, -ti); f.globalCompositeOperation = 'destination-out';
  const holes = [[C.x, C.y, 245 + grow * 60]];
  if (!inB) { for (const pl of PLACES) holes.push([pl.x, pl.y, 70 * sstep(pl.t0 - .1, pl.t0 + .6, t)]); holes.push([CAVE.x, CAVE.y, 95 * sstep(38.4, 39.6, t)]); }
  const pat = f.createPattern(checker, 'repeat');
  for (const [hx, hy, hr] of holes) if (hr > 1) { f.fillStyle = pat; f.beginPath(); f.arc(hx, hy, hr + 10, 0, 6.283); f.fill(); f.fillStyle = '#000'; f.beginPath(); f.arc(hx, hy, hr, 0, 6.283); f.fill(); }
  f.globalCompositeOperation = 'source-over';
  if (!inB && t > 10.5 && t < 14.3) [[250, 330], [470, 300], [560, 470], [150, 420], [420, 170]].forEach(([qx, qy], i) => { if (t < 10.5 + i * .3) return; drawQ(f, qx, qy + Math.round(Math.sin(t * 3 + i) * 2)); });
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = .96; x.drawImage(fog, 0, 0); x.globalAlpha = 1;

  // ----- saída ampliada com pixels nítidos
  const s = OUT * z;
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.fillStyle = '#000'; octx.fillRect(0, 0, 1080, 1920);
  octx.drawImage(view, 0, 0, cw, ch, Math.round(-(L - li) * s), Math.round(-(Tp - ti) * s), Math.round(cw * s), Math.round(ch * s));
  const dip = Math.max(sstep(43.25, CUT, t) * (1 - sstep(CUT, 43.85, t)), sstep(52.5, 53.3, t));
  if (dip > 0) { octx.fillStyle = `rgba(0,0,0,${dip})`; octx.fillRect(0, 0, 1080, 1920); }
  overlay(t, inB, L, Tp, s);
}

// =================================================================== textos sobrepostos
const capEl = document.getElementById('caption'), titleEl = document.getElementById('title'), counterEl = document.getElementById('counter');
const numEl = counterEl.querySelector('.num'), wordEl = counterEl.querySelector('.word');
const labA = document.getElementById('labA'), labB = document.getElementById('labB'), labC = document.getElementById('labC'), qEl = document.getElementById('q');
titleEl.innerHTML = 'ERYON'.split('').map(c => `<b>${c}</b>`).join('');
const letters = [...titleEl.querySelectorAll('b')];
const strip = w => w.replace(/[.,?!…]/g, '');
const syl = w => Math.max(1, (strip(w).match(/[aeiouáéíóúâêôãõày]+/gi) || []).length) + (/[.,?!…]$/.test(w) ? .8 : 0);
const capData = CUES.map(([a, b, txt], ci) => {
  const words = txt.split(' '), wts = words.map(syl), tot = wts.reduce((p, q) => p + q, 0);
  let acc = 0; const wt = words.map((w, i) => { const s0 = a + (b - a) * acc / tot; acc += wts[i]; return s0; });
  const groups = []; let cur = [];
  words.forEach((w, i) => { cur.push(i); const len = cur.map(j => words[j]).join(' ').length, nxt = words[i + 1];
    if (nxt && !/[.,?!…]$/.test(w) && cur.length < 3 && len + nxt.length < 17) return; groups.push(cur); cur = []; });
  if (cur.length) groups.push(cur);
  const next = CUES[ci + 1] ? CUES[ci + 1][0] : b + 2.5;
  return { a, hide: Math.min(b + .45, next - .05), groups: groups.map(g => ({ t: wt[g[0]], html: g.map(j => `<span class="${KEY.test(strip(words[j])) ? 'k' : ''}">${words[j]}</span>`).join(' ') })) };
});
let capKey = null;
function place(el, wx, wy, L, Tp, s, on) { el.style.left = Math.round((wx - L) * s) + 'px'; el.style.top = Math.round((wy - Tp) * s) + 'px'; el.style.display = on ? 'block' : 'none'; }
function overlay(t, inB, L, Tp, s) {
  let g = null; for (const d of capData) if (t >= d.a - .04 && t < d.hide) for (const gr of d.groups) if (t >= gr.t - .04) g = gr;
  const key = g ? g.html : ''; if (key !== capKey) { capKey = key; capEl.innerHTML = key; }
  if (g) capEl.style.transform = `translateY(${t - g.t + .04 < .07 ? 6 : 0}px)`;
  const on = !inB ? (t < 8.7 || (t > 26.6 && t < 36.1)) : (t > 44.1 && t < 48.9);
  counterEl.style.display = on ? 'flex' : 'none';
  numEl.textContent = (!inB && t > 26) ? 2 + NEWBIES.filter(q => t > q.tl).length : 2;
  wordEl.textContent = t > 5.7 ? 'moradores' : 'seguidores';
  const tOn = (!inB && t > 7.9 && t < 12.4) || (inB && t > 49.0);
  titleEl.style.display = tOn ? 'block' : 'none'; titleEl.style.top = (inB ? 330 : 380) + 'px';
  const t0 = inB ? 49.05 : 8.05;
  letters.forEach((el, i) => { const k = seg(t, t0 + i * .1, t0 + i * .1 + .25); el.style.visibility = k > 0 ? 'visible' : 'hidden'; el.style.transform = `translateY(${Math.round((1 - eOutBack(k)) * -10) * 8}px)`; });
  const lab = (!inB && t > 6.4 && t < 8.9) || (!inB && t > 18.3 && t < 19.7) || (inB && t > 44.2 && t < 47.6);
  place(labA, A.x, A.y - 15, L, Tp, s, lab); place(labB, B.x, B.y - 15, L, Tp, s, lab);
  place(labC, SEAT.x, SEAT.y + 4, L, Tp, s, inB && t > 49.4 && t < 52.6);
  place(qEl, SEAT.x, SEAT.y - 14, L, Tp, s, inB && t > 48.7 && t < 49.4 && Math.floor(t * 10) % 2);
}
window.render = render;
Promise.all([document.fonts.load('700 40px Pix'), document.fonts.load('400 40px P2P')]).then(() => { render(1); window.ready = true; });
