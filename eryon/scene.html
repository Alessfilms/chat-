<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Eryon</title>
<style>
@font-face{font-family:Deco;src:url(vendor/fonts/cinzel-decorative-latin-700-normal.woff2)}
@font-face{font-family:Cinzel;src:url(vendor/fonts/cinzel-latin-600-normal.woff2)}
@font-face{font-family:Corm;font-weight:600;src:url(vendor/fonts/cormorant-garamond-latin-600-normal.woff2)}

html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;width:1080px;height:1920px}
canvas{position:absolute;inset:0;width:1080px!important;height:1920px!important;image-rendering:pixelated}
.ov{position:absolute;pointer-events:none}
#capbg{left:0;right:0;top:1180px;height:560px;background:radial-gradient(ellipse 70% 45% at 50% 50%,rgba(10,14,8,.42),rgba(10,14,8,0) 100%)}
#caption{left:70px;right:70px;top:1330px;text-align:center;font:700 64px/1.16 Corm,serif;color:#fffbea;
  text-shadow:0 3px 0 rgba(20,26,14,.7),0 0 24px rgba(0,0,0,.7),0 0 6px rgba(0,0,0,.75);letter-spacing:.3px}
#caption span{display:inline-block;white-space:pre;will-change:transform,opacity,filter}
#caption span.k{color:#ffd77a}
#title{left:0;right:0;top:300px;text-align:center;font:700 170px/1 Deco,serif;color:#fff3cf;letter-spacing:14px;
  text-shadow:0 0 30px rgba(255,214,120,.75),0 0 80px rgba(255,190,90,.45),0 6px 0 rgba(60,40,20,.45)}
#title small{display:block;font:600 34px/1 Cinzel,serif;letter-spacing:16px;margin-top:22px;color:#fff6dd;
  text-shadow:0 0 14px rgba(0,0,0,.6)}
#title b{display:inline-block;font-weight:700}

  background:linear-gradient(180deg,rgba(40,36,30,.72),rgba(20,18,14,.72));border:2px solid rgba(255,220,150,.55);
  box-shadow:0 0 30px rgba(255,200,120,.25),inset 0 0 18px rgba(255,220,150,.12);
  font:600 44px/1 Cinzel,serif;color:#fff2d2;white-space:nowrap;display:flex;align-items:center;gap:18px}
#counter .ic{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#fff 0 22%,#ffe3a0 23% 30%,transparent 31%),
  radial-gradient(ellipse at 50% 100%,#ffe3a0 0 45%,transparent 46%);box-shadow:0 0 16px #ffcf70;border:2px solid #ffdc8a}
#counter .num{color:#ffd77a;min-width:30px;text-align:center;display:inline-block}
.label{transform:translate(-50%,-100%);font:600 34px/1 Cinzel,serif;color:#fff6dc;padding:10px 20px;border-radius:30px;
  background:rgba(25,22,18,.62);border:1.5px solid rgba(255,220,150,.6);white-space:nowrap;
  text-shadow:0 0 8px rgba(0,0,0,.5);box-shadow:0 0 18px rgba(255,210,130,.25)}
.label:after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-9px;border:9px solid transparent;border-top-color:rgba(255,220,150,.6);border-bottom:0}
#q{transform:translate(-50%,-50%);font:700 150px/1 Deco,serif;color:#fff;text-shadow:0 0 30px #ffe6a0,0 0 70px #ffc860}
</style>
</head>
<body>
<div id="stage">
  <div id="counter" class="ov"><span class="ic"></span><span class="num">2</span><span class="word">seguidores</span></div>
  <div id="title" class="ov"></div>
  <div id="labA" class="ov label">Morador 1</div>
  <div id="labB" class="ov label">Morador 2</div>
  <div id="labC" class="ov label">Morador 3</div>
  <div id="q" class="ov">?</div>
  <div id="capbg" class="ov"></div>
  <div id="caption" class="ov"></div>
</div>
<script type="module">
import * as THREE from './vendor/three.module.js';

// ============================================================ timing
const OFFSET = 0;            // segundos de abertura antes da narração
const END = 53.4;              // tempo de cena final
window.DURATION = OFFSET + END;
window.OFFSET = OFFSET;
const W = 1080, H = 1920, RS = 0.5;  // render a meia resolução e amplia em pixel art
const RW = W * RS, RH = H * RS;

const CUES = [
  [0.00, 2.56, "Essa página tem apenas 2 seguidores."],
  [3.07, 6.28, "Mas aqui, cada seguidor se torna um morador."],
  [6.92, 8.63, "E assim começa Eryon."],
  [9.24, 13.66, "Uma cidade em um território misterioso, onde ninguém jamais chegou."],
  [14.28, 17.60, "Por enquanto, tudo o que existe é uma pequena clareira…"],
  [18.16, 19.14, "e dois moradores."],
  [19.83, 20.60, "Não há casas."],
  [20.93, 21.62, "Não há ruas."],
  [22.01, 23.32, "Não há nada construído."],
  [23.91, 25.76, "Mas isso está prestes a mudar."],
  [26.38, 30.01, "Porque cada novo seguidor será um novo habitante de Eryon."],
  [30.61, 33.82, "Quanto mais pessoas chegarem, mais a cidade vai crescer."],
  [34.44, 35.86, "Casas serão construídas."],
  [36.20, 37.94, "Novos lugares serão explorados."],
  [38.47, 43.30, "E talvez existam coisas escondidas nesse mundo que ainda nem conhecemos."],
  [44.05, 45.66, "Hoje somos apenas dois."],
  [46.24, 47.56, "Agora resta descobrir…"],
  [48.16, 50.90, "quem será o terceiro morador de Eryon?"],
];
const KEYWORDS = /^(Eryon|2|morador|moradores|dois|terceiro|habitante|Casas|escondidas|clareira)$/i;

// ============================================================ helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eOutBack = k => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const pulse = (t, a, b, c) => sstep(a, b, t) * (1 - sstep(b, c, t));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(7);
const rr = (a, b) => a + (b - a) * R();
function hash2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
const fbm = (x, z) => vnoise(x, z) * .55 + vnoise(x * 2.1, z * 2.1) * .3 + vnoise(x * 4.3, z * 4.3) * .15;

// ============================================================ world layout
const riverZ = x => -28 + 8 * Math.sin(x * .03) + 4 * Math.sin(x * .071 + 1);
const BRIDGE = new THREE.Vector3(14, 0, riverZ(14));
const TOWER = new THREE.Vector3(-14, 0, -46);
const ARCH = new THREE.Vector3(36, 0, -6);
const GROVE = new THREE.Vector3(-42, 0, -10);
const DOOR = new THREE.Vector3(-44.5, 0, -13.5);
const FLAT = [[0, 0, 15, 26], [GROVE.x, GROVE.z, 7, 13], [BRIDGE.x, BRIDGE.z, 4, 9], [TOWER.x, TOWER.z, 4, 9], [ARCH.x, ARCH.z, 4, 9]];
function heightAt(x, z) {
  let f = 1;
  for (const [cx, cz, r0, r1] of FLAT) f = Math.min(f, sstep(r0, r1, Math.hypot(x - cx, z - cz)));
  let h = (fbm(x * .05, z * .05) - .45) * 7 * f;
  const r = Math.hypot(x, z);
  h += sstep(95, 150, r) * (fbm(x * .02 + 9, z * .02) * 40);
  const dr = Math.abs(z - riverZ(x));
  h = lerp(h, -1.0, 1 - sstep(2.6, 5.5, dr));
  return h;
}
const POS_A = new THREE.Vector3(2.2, 0, 2.4);   // morador 1 (sentado no tronco)
const POS_B = new THREE.Vector3(3.8, 0, 1.15);  // morador 2 (em pé)
const POS_C = new THREE.Vector3(0.55, 0, 3.35); // lugar do terceiro morador

// ============================================================ renderer
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(RW, RH, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('stage').prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe6d8, 40, 200);
const camera = new THREE.PerspectiveCamera(30, RW / RH, 0.3, 600);

// SSAA leve: renderiza a cena em 2x e reduz no pós
const rtBig = new THREE.WebGLRenderTarget(RW * 2, RH * 2, { type: THREE.HalfFloatType });
rtBig.depthTexture = new THREE.DepthTexture(RW * 2, RH * 2);
rtBig.depthTexture.type = THREE.UnsignedIntType;

// toon gradient
const gradTex = (() => { const d = new Uint8Array([70, 70, 70, 255, 160, 160, 160, 255, 255, 255, 255, 255]); const t = new THREE.DataTexture(d, 3, 1); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const timeU = { value: 0 };
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: gradTex, ...extra });
function swayMat(m, amp = .05) {
  m.onBeforeCompile = s => {
    s.uniforms.uTime = timeU;
    s.vertexShader = 'uniform float uTime;\n' + s.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
#ifdef USE_INSTANCING
float ph = instanceMatrix[3].x*.31 + instanceMatrix[3].z*.23;
#else
float ph = 0.0;
#endif
transformed.x += sin(uTime*1.25+ph)*${amp.toFixed(3)}*(position.y+1.2);
transformed.z += cos(uTime*.95+ph*1.3)*${(amp * .6).toFixed(3)}*(position.y+1.2);`);
  };
  return m;
}

// ============================================================ lights
const hemi = new THREE.HemisphereLight(0xd8ecff, 0x5d7d52, 1.15);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera; sc.left = -34; sc.right = 34; sc.top = 34; sc.bottom = -34; sc.near = 1; sc.far = 160;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03; sun.shadow.radius = 2;
scene.add(sun, sun.target);
const amb = new THREE.AmbientLight(0x9fb7d8, .25); scene.add(amb);

// ============================================================ ground
{
  const g = new THREE.PlaneGeometry(420, 420, 210, 210); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, col = [];
  const c1 = new THREE.Color(0xb7d867), c2 = new THREE.Color(0x92c255), c3 = new THREE.Color(0x7fb04c), sand = new THREE.Color(0xd9cf98), dirt = new THREE.Color(0xd8d199), tmp = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), h = heightAt(x, z); p.setY(i, h);
    const n = fbm(x * .09 + 3, z * .09);
    tmp.copy(c1).lerp(c2, sstep(.35, .7, n));
    const r = Math.hypot(x, z);
    tmp.lerp(c3, sstep(16, 40, r) * .7);
    tmp.lerp(dirt, (1 - sstep(2.2, 4.2, r)) * .55);
    const dr = Math.abs(z - riverZ(x)); tmp.lerp(sand, 1 - sstep(2.8, 4.2, dr));
    const gr = Math.hypot(x - GROVE.x, z - GROVE.z); tmp.lerp(new THREE.Color(0x4f8a5a), (1 - sstep(4, 12, gr)) * .6);
    if (r > 100) tmp.lerp(new THREE.Color(0x8aa7a0), sstep(100, 150, r));
    col.push(tmp.r, tmp.g, tmp.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, toon(0xffffff, { vertexColors: true }));
  m.receiveShadow = true; scene.add(m);
}
// river
const waterMat = new THREE.ShaderMaterial({
  fog: true, transparent: false,
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uTime: { value: 0 } }]),
  vertexShader: `varying vec2 vUv; varying vec3 vW;
#include <fog_pars_vertex>
void main(){ vUv=uv; vec4 mvPosition=modelViewMatrix*vec4(position,1.); vW=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*mvPosition;
#include <fog_vertex>
}`,
  fragmentShader: `uniform float uTime; varying vec2 vUv; varying vec3 vW;
#include <fog_pars_fragment>
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){
  float edge = smoothstep(0.0,0.18,vUv.y)*smoothstep(1.0,0.82,vUv.y);
  vec3 deep = vec3(.27,.55,.80), shal=vec3(.55,.80,.92);
  vec3 c = mix(shal,deep,edge);
  vec2 q = vec2(vW.x*.55 - uTime*1.2, vUv.y*9.0);
  float cell = h(floor(q));
  float st = step(.86, cell) * step(.35, fract(q.x)) * step(fract(q.x), .9) * step(.3, fract(q.y)) * step(fract(q.y),.62);
  c = mix(c, vec3(.93,.98,1.), st*.85);
  c = mix(vec3(.95,.98,1.), c, smoothstep(0.0,.07,vUv.y)*smoothstep(1.,.93,vUv.y));
  gl_FragColor = vec4(c,1.);
#include <colorspace_fragment>
#include <fog_fragment>
}`
});
{
  const pts = []; for (let x = -210; x <= 210; x += 2) pts.push(new THREE.Vector3(x, 0, riverZ(x)));
  const pos = [], uv = [], idx = [];
  pts.forEach((p, i) => {
    const pn = pts[Math.min(i + 1, pts.length - 1)], pp = pts[Math.max(i - 1, 0)];
    const d = new THREE.Vector3().subVectors(pn, pp).normalize(); const n = new THREE.Vector3(-d.z, 0, d.x);
    const w = 3.3;
    pos.push(p.x + n.x * w, -.42, p.z + n.z * w, p.x - n.x * w, -.42, p.z - n.z * w);
    uv.push(i / pts.length, 0, i / pts.length, 1);
    if (i < pts.length - 1) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
  const m = new THREE.Mesh(g, waterMat); m.receiveShadow = false; scene.add(m);
}

// ============================================================ trees (instanced)
const treeList = []; // {x,z,s,type,recede}
function inWedge(x, z) { // abertura na mata por onde a câmera enquadra os moradores
  const r = Math.hypot(x, z); if (r > 34) return false; let d = Math.atan2(z, x) - 0.87; d = Math.atan2(Math.sin(d), Math.cos(d));
  return Math.abs(d) < 0.2 + 0.06 * Math.sin(r * .7);
}
function inCorridor(x, z) { // corredor livre por onde a câmera entra no bosque
  const dx = x - GROVE.x, dz = z - GROVE.z, ux = .74, uz = .67; const along = dx * ux + dz * uz, perp = Math.abs(-dx * uz + dz * ux);
  return along > 0 && along < 22 && perp < 3.2 + along * .12;
}
{
  let tries = 0;
  while (treeList.length < 2600 && tries++ < 40000) {
    const ang = R() * Math.PI * 2, r = 11.5 + Math.pow(R(), .8) * 135;
    const x = Math.cos(ang) * r, z = Math.sin(ang) * r;
    if (Math.abs(z - riverZ(x)) < 5) continue;
    if (Math.hypot(x - GROVE.x, z - GROVE.z) < 6.5) continue;
    if (inCorridor(x, z) || inWedge(x, z)) continue;
    if (Math.hypot(x - BRIDGE.x, z - BRIDGE.z) < 6) continue;
    if (Math.hypot(x - TOWER.x, z - TOWER.z) < 6) continue;
    if (Math.hypot(x - ARCH.x, z - ARCH.z) < 5.5) continue;
    if (r < 16 && fbm(x * .3, z * .3) < .42) continue; // borda irregular
    let ok = true; for (let k = treeList.length - 1; k >= Math.max(0, treeList.length - 60); k--) { const o = treeList[k]; if ((o.x - x) ** 2 + (o.z - z) ** 2 < 4.4) { ok = false; break; } }
    if (!ok) continue;
    treeList.push({ x, z, y: heightAt(x, z), s: rr(.85, 1.55) * (r > 60 ? 1.25 : 1), type: R() < .33 ? 1 : 0, rot: R() * 6.28, r });
  }
  // árvores extras perto do bosque escondido (denso e escuro)
  for (let i = 0; i < 70; i++) { const a = R() * 6.28, r = 7 + R() * 9; const x = GROVE.x + Math.cos(a) * r, z = GROVE.z + Math.sin(a) * r; if (inCorridor(x, z)) continue; treeList.push({ x, z, y: heightAt(x, z), s: rr(1.2, 1.9), type: R() < .6 ? 1 : 0, rot: R() * 6.28, r: 99 }); }
}
const recedeIdx = [];
const treeParts = [];
{
  const trunkG = new THREE.CylinderGeometry(.16, .26, 1.4, 5); trunkG.translate(0, .7, 0);
  const crownG = new THREE.IcosahedronGeometry(1.15, 0); crownG.translate(0, 2.15, 0);
  const crown2G = new THREE.IcosahedronGeometry(.75, 0); crown2G.translate(.25, 2.95, .1);
  const cone1 = new THREE.ConeGeometry(1.15, 1.6, 6); cone1.translate(0, 1.7, 0);
  const cone2 = new THREE.ConeGeometry(.9, 1.4, 6); cone2.translate(0, 2.5, 0);
  const cone3 = new THREE.ConeGeometry(.6, 1.2, 6); cone3.translate(0, 3.25, 0);
  const trunkM = toon(0x8a6a4e), crownM = swayMat(toon(0xffffff)), pineM = swayMat(toon(0xffffff), .035);
  const defs = [[trunkG, trunkM, 'all'], [crownG, crownM, 0], [crown2G, crownM, 0], [cone1, pineM, 1], [cone2, pineM, 1], [cone3, pineM, 1]];
  const greens = [0x5fae48, 0x6dbb4f, 0x4f9f41, 0x7cc257, 0x58a24c, 0x8cc65a], pines = [0x3e8a4f, 0x47965a, 0x367d4a, 0x2f7047];
  const dummy = new THREE.Object3D(), col = new THREE.Color();
  for (const [g, m, ty] of defs) {
    const list = treeList.filter(t => ty === 'all' || t.type === ty);
    const im = new THREE.InstancedMesh(g, m, list.length);
    im.castShadow = true; im.receiveShadow = true;
    const base = [];
    list.forEach((t, i) => {
      dummy.position.set(t.x, t.y - .05, t.z); dummy.rotation.set(0, t.rot, 0); dummy.scale.setScalar(t.s); dummy.updateMatrix();
      im.setMatrixAt(i, dummy.matrix); base.push(dummy.matrix.clone());
      const pal = t.type ? pines : greens; col.setHex(pal[Math.floor(hash2(t.x, t.z) * pal.length)]);
      if (g === crown2G) col.offsetHSL(0, 0, .05);
      if (t.r === 99) col.multiplyScalar(.75);
      if (m !== trunkM) im.setColorAt(i, col);
    });
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    scene.add(im);
    treeParts.push({ im, list, base });
  }
}
let treeRecedeState = -1;
function setRecede(k) { // k:0..1 recuo da floresta interna
  const q = Math.round(k * 200) / 200; if (q === treeRecedeState) return; treeRecedeState = q;
  const m = new THREE.Matrix4(), s = new THREE.Matrix4(), v = new THREE.Vector3();
  for (const p of treeParts) {
    let changed = false;
    p.list.forEach((t, i) => {
      if (t.r > 24) return;
      const local = clamp(q * 1.35 - (t.r - 11.5) / 12.5 * .35);
      const sc = 1 - eInOut(local);
      m.copy(p.base[i]);
      if (sc < .999) { v.setFromMatrixPosition(m); s.makeTranslation(v.x, v.y, v.z).multiply(new THREE.Matrix4().makeScale(sc, sc, sc)).multiply(new THREE.Matrix4().makeTranslation(-v.x, -v.y, -v.z)); m.premultiply(s); }
      p.im.setMatrixAt(i, m); changed = true;
    });
    if (changed) p.im.instanceMatrix.needsUpdate = true;
  }
}

// ============================================================ small vegetation
function scatterInstanced(geo, mat, n, place, colors, castShadow = false) {
  const im = new THREE.InstancedMesh(geo, mat, n); const d = new THREE.Object3D(), c = new THREE.Color();
  for (let i = 0; i < n; i++) { place(d, i); d.updateMatrix(); im.setMatrixAt(i, d.matrix); if (colors) { c.setHex(colors[i % colors.length]); im.setColorAt(i, c); } }
  im.castShadow = castShadow; im.receiveShadow = true; scene.add(im); return im;
}
const ringPos = (rmin, rmax) => { const a = R() * 6.28, r = rmin + Math.sqrt(R()) * (rmax - rmin); return [Math.cos(a) * r, Math.sin(a) * r]; };
// flores
scatterInstanced(new THREE.OctahedronGeometry(.075, 0), toon(0xffffff, { emissive: 0x221122 }), 900, (d) => {
  let [x, z] = ringPos(2.6, 22); if (R() < .3) { x += rr(-40, 40); z += rr(-40, 40); }
  d.position.set(x, heightAt(x, z) + .1, z); d.scale.setScalar(rr(.7, 1.4)); d.rotation.set(R(), R(), R());
}, [0xf6b6d8, 0xffffff, 0xd9b3ff, 0xf6b6d8, 0xffe08a]);
// tufos de grama

function hermite(keys, t, idx) {
  if (t <= keys[0][0]) return keys[0][idx].length ? keys[0][idx].slice() : keys[0][idx];

  let i = 0; while (keys[i + 1][0] < t) i++;
  const k0 = keys[i], k1 = keys[i + 1]; const dt = k1[0] - k0[0], u = (t - k0[0]) / dt;

  const m0 = tan(i), m1 = tan(i + 1), p0 = val(k0), p1 = val(k1);
  const h00 = 2 * u ** 3 - 3 * u * u + 1, h10 = u ** 3 - 2 * u * u + u, h01 = -2 * u ** 3 + 3 * u * u, h11 = u ** 3 - u * u;
  const out = p0.map((x, q) => h00 * x + h10 * dt * m0[q] + h01 * p1[q] + h11 * dt * m1[q]);

}
