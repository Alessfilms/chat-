<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Reino Sem Histórias</title>
<style>
  :root { --bg: #0a0d0c; --ink: #f4e9c8; --gold: #e8c048; --line: #d4c290; --panel: #1b1a12; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px 16px; }
  .stage { position: relative; height: min(calc(100vh - 80px), calc((100vw - 32px) * 16 / 9)); aspect-ratio: 9 / 16; }
  canvas { width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block;
    box-shadow: 0 0 0 3px #07080a, 0 0 0 5px var(--line), 0 20px 60px rgba(0,0,0,.6); }
  .start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(6,8,10,.55); cursor: pointer; border: 0; color: var(--ink); font: inherit; }
  .start b { font-size: clamp(14px, 3.4vh, 26px); letter-spacing: .08em; color: var(--gold); text-shadow: 2px 2px 0 #000; }
  .start span { padding: 10px 18px; background: var(--panel); border: 3px solid var(--line); box-shadow: 0 0 0 3px #07080a; letter-spacing: .1em; }
  .start:hover span { background: #2a2817; }
  .bar { width: min(100%, 520px); display: flex; align-items: center; gap: 8px; }
  .bar button { background: var(--panel); color: var(--ink); border: 2px solid var(--line); font: inherit; font-size: 12px; padding: 6px 10px; cursor: pointer; min-width: 44px; }
  .bar button[aria-pressed="false"] { opacity: .55; }
  .track { flex: 1; height: 10px; background: #07080a; border: 2px solid var(--line); position: relative; cursor: pointer; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--gold); }
  .time { font-size: 12px; min-width: 44px; text-align: right; }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="c" width="216" height="384" aria-label="Animação em pixel art: O Reino Sem Histórias"></canvas>
    <button class="start" id="start"><b>O REINO SEM HISTÓRIAS</b><span>▶ COMEÇAR</span></button>
  </div>
  <div class="bar">
    <button id="play" title="Tocar / pausar">▶</button>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <span class="time" id="time">0:00</span>
    <button id="subs" aria-pressed="true" title="Legendas">CC</button>
  </div>
  <audio id="audio" src="narracao.mp3" preload="auto"></audio>
<script src="story.js"></script>
<script>
  const canvas = document.getElementById('c');
  Story.init(canvas);
  const params = new URLSearchParams(location.search);
  if (params.has('render')) {
    document.getElementById('start').remove();
    window.renderAt = t => { Story.render(t); return canvas.toDataURL('image/png'); };
  } else {
    const audio = document.getElementById('audio'), playBtn = document.getElementById('play');
    const fill = document.getElementById('fill'), time = document.getElementById('time'), start = document.getElementById('start');
    const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
    const toggle = () => { audio.paused ? audio.play() : audio.pause(); };
    start.onclick = () => { start.remove(); audio.play(); };
    playBtn.onclick = () => { if (start.isConnected) start.remove(); toggle(); };
    audio.onplay = () => playBtn.textContent = '❚❚';
    audio.onpause = () => playBtn.textContent = '▶';
    document.getElementById('track').onclick = e => {
      const r = e.currentTarget.getBoundingClientRect();
      audio.currentTime = ((e.clientX - r.left) / r.width) * (audio.duration || Story.DURATION);
    };
    const subs = document.getElementById('subs');
    subs.onclick = () => { const v = subs.getAttribute('aria-pressed') !== 'true'; subs.setAttribute('aria-pressed', v); Story.setSubs(v); };
    document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (start.isConnected) start.remove(); toggle(); } });
    const loop = () => {
      const t = audio.currentTime;
      Story.render(start.isConnected ? 2.5 + (performance.now() / 1000) % 2 : t);
      fill.style.width = (t / (audio.duration || Story.DURATION) * 100) + '%';
      time.textContent = fmt(t);
      requestAnimationFrame(loop);
    };
    loop();
  }
</script>
</body>
</html>
