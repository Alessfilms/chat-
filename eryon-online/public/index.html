<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c1410">
<title>Eryon Online</title>
<style>
@font-face{font-family:Pix;src:url(fonts/pixelify-sans-latin-700-normal.woff2)}
@font-face{font-family:P2P;src:url(fonts/press-start-2p-latin-400-normal.woff2)}
:root{--ink:#140e06;--panel:#1c2a22;--edge:#c9a46a;--gold:#ffd84a;--cream:#fff3b0;--txt:#eef0ea}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#060b0a;color:var(--txt);font-family:Pix,monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.box{background:var(--panel);border:4px solid #0c1410;box-shadow:inset 0 0 0 3px var(--edge),0 6px 0 rgba(0,0,0,.5)}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 40%,#1c3831,#060b0a 70%)}
#login .box{width:min(420px,100%);padding:26px 22px;display:flex;flex-direction:column;gap:14px}
h1{font:400 34px/1 P2P,monospace;color:var(--gold);text-align:center;margin:4px 0 2px;text-shadow:3px 3px 0 var(--ink)}
.sub{text-align:center;color:var(--cream);font-size:17px;margin:0 0 6px;line-height:1.35}
label{font-size:15px;color:var(--gold);text-transform:uppercase;letter-spacing:1px}
input{width:100%;font:700 20px Pix,monospace;padding:11px 12px;background:#0c1410;color:var(--txt);border:3px solid #3c5d4a;outline:none;-webkit-user-select:text;user-select:text}
input:focus{border-color:var(--gold)}
button{font:700 20px Pix,monospace;padding:12px 14px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button.sec{background:#3c5d4a;color:var(--txt)}
.err{color:#ff8a70;min-height:1.2em;font-size:16px;text-align:center;margin:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border:3px solid #0c1410;cursor:pointer}
.sw.on{outline:3px solid var(--gold);outline-offset:1px}
#preview{display:block;margin:0 auto;image-rendering:pixelated;width:84px;height:102px}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:none;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:3}
#hud .box{padding:8px 12px;font-size:16px;color:var(--cream);pointer-events:auto}
#nameErr{color:#ff8a70;font-size:14px;display:block}
.hudbtn{font:700 16px Pix,monospace;color:var(--cream);padding:8px 12px;cursor:pointer;pointer-events:auto}
.hudbtn:active{transform:translateY(2px)}
#plist{display:flex;flex-direction:column;gap:2px;padding:6px;max-height:45vh;overflow:auto;pointer-events:auto;min-width:180px}
#plist .pl{font:700 16px Pix,monospace;background:none;border:0;box-shadow:none;color:var(--txt);text-align:left;padding:7px 8px}
#plist .pl:hover,#plist .pl:focus-visible{background:#2a4a3d}
#actbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom));display:none;gap:8px;z-index:2}
#actbar .act{font-size:18px;padding:10px 16px;white-space:nowrap}
#actBtn{background:#ffd84a!important;color:#140e06!important}
#camctl{position:fixed;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:8px;z-index:2}
#camctl .hudbtn{width:46px;height:46px;padding:0;font-size:24px;line-height:1}
#avatar{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(6,11,10,.8)}
.avbox{width:min(460px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
#avPrev{display:block;margin:0 auto;width:128px;height:144px;image-rendering:pixelated;background:#0c1410;border:3px solid #3c5d4a}
.avgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.avgrid label{font-size:13px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:700 15px Pix,monospace;padding:6px 10px;background:#0c1410;color:var(--txt);border:2px solid #3c5d4a;box-shadow:none}
.opt.on{border-color:var(--gold);color:var(--gold)}
.opt.sw{width:30px;height:30px;padding:0;color:#c4ccd0}
.opt.sw.on{outline:3px solid var(--gold);outline-offset:1px}
@media (max-width:420px){.avgrid{grid-template-columns:1fr}}
#hud b{color:var(--gold);font-weight:700}
#chatlog{position:fixed;left:10px;bottom:calc(122px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 20px));display:none;flex-direction:column;gap:4px;pointer-events:none}
#chatlog div{background:rgba(12,20,16,.72);padding:5px 8px;font-size:16px;line-height:1.25;word-wrap:break-word;border-left:3px solid var(--edge)}
#chatlog b{color:var(--gold)}
#chatbar{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:none;gap:8px}
#chatbar input{flex:1;min-width:0;font-size:18px;padding:10px}
#chatbar button{padding:10px 14px;font-size:18px}
#help{font-size:14px;color:#c4ccd0}
button.link{background:none;border:none;box-shadow:none;color:#c4ccd0;font-size:16px;padding:4px;text-decoration:underline}
.word{font:400 24px/1.3 P2P,monospace;color:var(--gold);text-align:center;background:#0c1410;border:3px dashed var(--edge);padding:16px 8px;-webkit-user-select:all;user-select:all;letter-spacing:2px}
.row2{display:flex;gap:10px}.row2>*{flex:1;text-align:center}
.btnlink{font:700 20px Pix,monospace;padding:12px 14px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);text-decoration:none}
@keyframes blink{50%{opacity:.4}} #vstatus.wait{animation:blink 1.4s steps(2) infinite}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="login" hidden>
  <div class="box" id="loginCard">
    <h1>ERYON</h1>
    <p class="sub" id="sub">A cidade dos seguidores.<br>Digite o seu @ do Instagram para entrar.</p>
    <label for="user">Seu @ do Instagram</label>
    <input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="@seu_usuario" maxlength="31">
    <div id="codeRow" hidden style="display:flex;flex-direction:column;gap:10px">
      <label for="code">Código de acesso</label>
      <input id="code" autocapitalize="characters" spellcheck="false" placeholder="ABC123" maxlength="6">
    </div>
    <button id="enter" type="button">Continuar</button>
    <button id="haveCode" type="button" class="link">Tenho um código de acesso</button>
    <p class="err" id="err"></p>
  </div>
  <div class="box" id="verifyCard" hidden>
    <h1>É VOCÊ?</h1>
    <p class="sub">Para provar que é você, comente no post de Eryon exatamente:</p>
    <div class="word" id="word">ERYON ····</div>
    <div class="row2"><button id="copyWord" type="button" class="sec">Copiar</button><a id="openPost" class="btnlink" target="_blank" rel="noopener">Abrir o post</a></div>
    <p class="sub" id="vstatus">Esperando o seu comentário…</p>
    <button id="back" type="button" class="link">Voltar</button>
  </div>
  <div class="box" id="lookCard" hidden>
    <h1>SEU MORADOR</h1>
    <canvas id="preview" width="14" height="17"></canvas>
    <label>Cabelo</label><div class="swatches" id="swHair"></div>
    <label>Roupa</label><div class="swatches" id="swShirt"></div>
    <label>Calça</label><div class="swatches" id="swPants"></div>
    <button id="lookOk" type="button">Pronto</button>
  </div>
</div>

<div id="hud"><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><button class="box hudbtn" id="onlineBtn" type="button">Online: <b id="online">1</b> ▾</button><div id="plist" class="box" hidden></div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><div class="box" id="nameBox"><button id="nameBtn" type="button" class="link" style="padding:0;font-size:16px;color:#ffd84a">Usar meu @</button><span id="nameForm" hidden style="display:flex;gap:6px;align-items:center"><input id="newName" placeholder="@seu_usuario" maxlength="31" autocapitalize="none" spellcheck="false" style="width:150px;font-size:16px;padding:6px"><button id="nameOk" type="button" style="padding:6px 10px;font-size:16px">OK</button></span></div><button class="box hudbtn" id="avatarBtn" type="button">Meu avatar</button><div style="display:flex;gap:6px"><div class="box" style="padding:6px 10px;font-size:16px;color:#fff3b0" title="Lenha">Lenha: <b id="wood">0</b></div><button class="box hudbtn" id="muteBtn" type="button" title="Desligar som" style="padding:6px 8px;line-height:0"></button></div></div></div>
<div id="actbar"><button id="actBtn" type="button" class="box hudbtn act" hidden>Ação</button><button id="magicBtn" type="button" class="box hudbtn act">Magia  [Q]</button></div>
<div id="camctl"><button id="recenter" type="button" class="box hudbtn" hidden title="Voltar para o meu personagem">◎</button><button id="zin" type="button" class="box hudbtn" title="Aproximar">+</button><button id="zout" type="button" class="box hudbtn" title="Afastar">−</button></div>
<div id="avatar" hidden><div class="box avbox">
  <h1>SEU AVATAR</h1>
  <canvas id="avPrev" width="16" height="18"></canvas>
  <div class="avgrid">
    <label>Pele</label><div class="opts" id="avSkin"></div>
    <label>Cor do cabelo</label><div class="opts" id="avHair"></div>
    <label>Cabelo</label><div class="opts" id="avHairLen"></div>
    <label>Barba</label><div class="opts" id="avBeard"></div>
    <label>Chapéu</label><div class="opts" id="avHat"></div>
    <label>Orelhas</label><div class="opts" id="avEars"></div>
    <label>Roupa</label><div class="opts" id="avShirt"></div>
    <label>Calça</label><div class="opts" id="avPants"></div>
    <label>Capa</label><div class="opts" id="avCape"></div>
  </div>
  <div class="row2"><button id="avSkip" type="button" class="sec">Pular</button><button id="avSave" type="button">Salvar</button></div>
</div></div>
<div id="chatlog"></div>
<div id="chatbar"><input id="msg" maxlength="120" placeholder="Fale com Eryon…" autocomplete="off"><button id="sendBtn" type="button">Falar</button></div>

<script src="engine.js?v=7"></script>
<script src="life.js?v=7"></script>
<script src="game.js?v=7"></script>
</body>
</html>
