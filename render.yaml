# Blueprint do Render (render.com): New + > Blueprint > aponte para este repositório.
services:
  - type: web
    name: eryon-online
    runtime: node
    rootDir: eryon-online
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: CODE_SECRET
        generateValue: true
      # memória permanente do mundo (crie grátis em console.upstash.com e cole aqui no painel do Render)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
